<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cupones Pet Planet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1B5E3B;
    --verde-claro: #2d7a51;
    --crema: #F2E6D5;
    --crema-oscuro: #E8D5BB;
    --bg: #EAE4DB;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 16px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    max-width: 480px;
    margin: 0 auto 16px;
    background: var(--verde);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: rgba(242,230,213,0.6);
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: var(--crema); color: var(--verde); }

  /* ── PANEL FORMULARIO ── */
  #panelForm { display: block; }
  #panelCupon { display: none; }

  .form-box {
    max-width: 480px;
    margin: 0 auto;
    background: var(--verde);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  label {
    display: block;
    color: rgba(242,230,213,0.65);
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 5px;
  }

  input, textarea, select {
    width: 100%;
    background: rgba(242,230,213,0.1);
    border: 1.5px solid rgba(242,230,213,0.2);
    border-radius: 10px;
    color: var(--crema);
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border 0.2s;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus { border-color: var(--crema); }
  textarea { height: 60px; resize: none; }

  .type-row { display: flex; gap: 8px; }
  .type-btn {
    flex: 1;
    padding: 11px 0;
    border-radius: 10px;
    border: 1.5px solid rgba(242,230,213,0.25);
    background: transparent;
    color: rgba(242,230,213,0.5);
    font-family: 'Lato', sans-serif;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .type-btn.active { background: var(--crema); color: var(--verde); border-color: var(--crema); }

  .btn-ver {
    width: 100%;
    padding: 15px;
    background: var(--crema);
    border: none;
    border-radius: 12px;
    color: var(--verde);
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }

  /* ── CUPÓN ── */
  .cupon-wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  .cupon {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(27,94,59,0.25);
  }

  /* CABECERA */
  .cupon-header {
    background: var(--verde);
    padding: 24px 24px 20px;
    position: relative;
    overflow: hidden;
  }

  .cupon-header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(242,230,213,0.06);
  }
  .cupon-header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(242,230,213,0.04);
  }

  .cupon-top-row {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
    margin-bottom: 16px;
  }

  .cupon-logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(242,230,213,0.4);
    flex-shrink: 0;
    background: var(--crema);
  }

  .cupon-brand {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242,230,213,0.55);
    margin-bottom: 2px;
  }

  .cupon-tienda {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--crema);
  }

  /* DESCUENTO GRANDE */
  .cupon-descuento {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 8px 0 4px;
  }

  .descuento-valor {
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    font-weight: 900;
    color: var(--crema);
    line-height: 1;
    display: block;
  }

  .descuento-aplica {
    font-size: 15px;
    font-weight: 700;
    color: rgba(242,230,213,0.7);
    margin-top: 4px;
  }

  /* SEPARADOR */
  .cupon-sep {
    display: flex;
    align-items: center;
    background: white;
    height: 24px;
  }
  .sep-circulo {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--bg);
    flex-shrink: 0;
  }
  .sep-linea {
    flex: 1;
    border-top: 2px dashed rgba(27,94,59,0.15);
    margin: 0 8px;
  }

  /* CUERPO */
  .cupon-body {
    padding: 20px 24px 24px;
    background: white;
  }

  .cupon-vence {
    background: #FFF3E0;
    border: 1.5px solid #FFB74D;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vence-icono { font-size: 20px; }
  .vence-texto {
    font-size: 13px;
    font-weight: 700;
    color: #E65100;
  }
  .vence-fecha {
    font-size: 16px;
    font-weight: 900;
    color: #BF360C;
  }

  .cupon-codigo-label {
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(27,94,59,0.4);
    margin-bottom: 6px;
  }

  .cupon-codigo {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: 0.05em;
    margin-bottom: 16px;
    word-break: break-all;
  }

  .cupon-conds {
    font-size: 11px;
    color: rgba(27,94,59,0.45);
    line-height: 1.6;
    border-top: 1px solid rgba(27,94,59,0.1);
    padding-top: 12px;
  }

  /* BOTONES CUPÓN */
  .cupon-btns {
    display: flex;
    gap: 10px;
    max-width: 480px;
    margin: 16px auto 0;
  }
  .btn-editar {
    flex: 1;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--verde);
    border-radius: 12px;
    color: var(--verde);
    font-family: 'Lato', sans-serif;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-guardar {
    flex: 2;
    padding: 14px;
    background: var(--verde);
    border: none;
    border-radius: 12px;
    color: var(--crema);
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  @media print {
    body { background: white; padding: 0; }
    .tabs, .cupon-btns, #panelForm { display: none !important; }
    #panelCupon { display: block !important; }
    .cupon-wrap { max-width: 100%; }
    .cupon { box-shadow: none; border-radius: 0; }
  }
</style>
</head>

  <div class="cupon-btns">
    <button class="btn-editar" onclick="showPanel('form', null)">← Editar</button>
    <button class="btn-guardar" onclick="window.print()">🖨️ Guardar PDF</button>
  </div>
</div>

<script>
  let discType = 'pct';

  window.onload = function() {
    document.getElementById('cuponLogo').src = document.getElementById('logoSrc').src;
  };

  function showPanel(panel, btn) {
    if (panel === 'cupon') generate();
    document.getElementById('panelForm').style.display = panel === 'form' ? 'block' : 'none';
    document.getElementById('panelCupon').style.display = panel === 'cupon' ? 'block' : 'none';
    if (btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
    }
  }

  function verCupon() {
    generate();
    showPanel('cupon', document.querySelectorAll('.tab')[1]);
  }

  function setType(t, btn) {
    discType = t;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('amtField').style.display = t === '2x1' ? 'none' : '';
  }

  function generate() {
    const val   = document.getElementById('discVal').value || '20';
    const desc  = document.getElementById('descTxt').value || '';
    const code  = document.getElementById('codeVal').value || 'CODIGO';
    const exp   = document.getElementById('expiry').value || '';
    const conds = document.getElementById('condsTxt').value || '';

    let headline;
    if (discType === 'pct')       headline = `${val}% OFF`;
    else if (discType === 'fix')  headline = `$${val} OFF`;
    else                           headline = `2×1 GRATIS`;

    document.getElementById('cHeadline').textContent = headline;
    document.getElementById('cSub').textContent      = desc;
    document.getElementById('cCode').textContent     = code.toUpperCase();
    document.getElementById('cExpiry').textContent   = exp ? `Válido hasta el ${exp}` : '';
    document.getElementById('cConds').textContent    = conds;
  }
</script>
</body>
</html>
