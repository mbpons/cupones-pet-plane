<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupones Pet Planet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1B5E3B;
    --crema: #F2E6D5;
    --blanco: #FEFAF4;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: #f0ece6;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: var(--verde);
    font-size: 22px;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ── FORMULARIO ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 700px;
    margin: 0 auto 24px;
    background: var(--verde);
    border-radius: 16px;
    padding: 20px;
  }

  @media (max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
  }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-group.full { grid-column: 1 / -1; }

  label {
    color: rgba(242,230,213,0.7);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  input, select, textarea {
    width: 100%;
    background: rgba(242,230,213,0.12);
    border: 1px solid rgba(242,230,213,0.25);
    border-radius: 8px;
    color: var(--crema);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--crema); }
  select option { background: var(--verde); }
  textarea { height: 52px; resize: none; }

  .type-row { display: flex; gap: 8px; }
  .type-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    border: 1.5px solid rgba(242,230,213,0.3);
    background: transparent;
    color: rgba(242,230,213,0.55);
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .type-btn.active { background: var(--crema); color: var(--verde); border-color: var(--crema); }

  .btn-row {
    display: flex;
    gap: 10px;
    max-width: 700px;
    margin: 0 auto 32px;
  }

  .btn-gen {
    flex: 2;
    padding: 14px;
    background: var(--verde);
    border: none;
    border-radius: 10px;
    color: var(--crema);
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-gen:hover { opacity: 0.85; }

  .btn-print {
    flex: 1;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--verde);
    border-radius: 10px;
    color: var(--verde);
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-print:hover { background: var(--verde); color: var(--crema); }

  /* ── CUPÓN ── */
  .coupon-wrap {
    max-width: 600px;
    margin: 0 auto;
    filter: drop-shadow(0 16px 40px rgba(27,94,59,0.2));
  }

  .coupon {
    background: var(--crema);
    border-radius: 18px;
    overflow: hidden;
  }

  .coupon-top {
    background: var(--verde);
    padding: 28px 28px 22px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .coupon-top::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(242,230,213,0.06);
  }

  .coupon-logo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(242,230,213,0.35);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .coupon-top-text { position: relative; z-index: 1; }

  .coupon-brand {
    font-family: 'Lato', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242,230,213,0.6);
    margin-bottom: 4px;
  }

  .coupon-headline {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: var(--crema);
    line-height: 1;
    margin-bottom: 6px;
  }

  .coupon-sub {
    font-size: 13px;
    font-weight: 700;
    color: rgba(242,230,213,0.72);
  }

  .coupon-sep {
    display: flex;
    align-items: center;
    background: var(--crema);
  }
  .sep-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #f0ece6;
    flex-shrink: 0;
  }
  .sep-line {
    flex: 1;
    border-top: 2px dashed rgba(27,94,59,0.18);
    margin: 0 10px;
  }

  .coupon-bottom {
    padding: 18px 28px 26px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    position: relative;
  }

  .code-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(27,94,59,0.4);
    margin-bottom: 4px;
  }
  .code-value {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--verde);
    letter-spacing: 0.05em;
  }
  .code-expiry {
    font-size: 11px;
    font-weight: 700;
    color: rgba(27,94,59,0.38);
    margin-top: 4px;
  }

  .conds-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(27,94,59,0.38);
    margin-bottom: 3px;
    text-align: right;
  }
  .conds-text {
    font-size: 10px;
    color: rgba(27,94,59,0.48);
    line-height: 1.5;
    text-align: right;
    max-width: 160px;
  }

  .paw-bg {
    position: absolute;
    bottom: 10px; right: 14px;
    font-size: 52px;
    opacity: 0.06;
    pointer-events: none;
  }

  @media print {
    body { background: white; padding: 10px; }
    .form-grid, .btn-row { display: none; }
    h1 { display: none; }
    .coupon-wrap { filter: none; }
  }
</style>
</head>
<body>

<h1>🐾 Cupones Pet Planet</h1>

<!-- FORMULARIO -->
<div class="form-grid">

  <div class="field-group">
    <label>Nombre de la tienda</label>
    <input type="text" id="brandName" value="Pet Planet">
  </div>

  <div class="field-group">
    <label>Tipo de descuento</label>
    <div class="type-row">
      <button class="type-btn active" onclick="setType('pct',this)">% Off</button>
      <button class="type-btn" onclick="setType('fix',this)">$ Fijo</button>
      <button class="type-btn" onclick="setType('2x1',this)">2×1</button>
    </div>
  </div>

  <div class="field-group" id="amtField">
    <label>Valor del descuento</label>
    <input type="number" id="discVal" value="20" min="1">
  </div>

  <div class="field-group">
    <label>Código del cupón</label>
    <input type="text" id="codeVal" value="PETPLANET20">
  </div>

  <div class="field-group">
    <label>Aplica en</label>
    <input type="text" id="descTxt" value="Toda la tienda">
  </div>

  <div class="field-group">
    <label>Válido hasta</label>
    <input type="text" id="expiry" value="31 de julio 2025">
  </div>

  <div class="field-group full">
    <label>Condiciones</label>
    <textarea id="condsTxt">No acumulable. Un uso por cliente.</textarea>
  </div>

</div>

<div class="btn-row">
  <button class="btn-gen" onclick="generate()">✨ Generar cupón</button>
  <button class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
</div>

<!-- CUPÓN -->
<div class="coupon-wrap">
  <div class="coupon">
    <div class="coupon-top">
      <img class="coupon-logo" id="couponLogo" src="" alt="PP"/>
      <div class="coupon-top-text">
        <div class="coupon-brand" id="cBrand">PET PLANET · TIENDA DE MASCOTAS</div>
        <div class="coupon-headline" id="cHeadline">20% OFF</div>
        <div class="coupon-sub" id="cSub">Toda la tienda</div>
      </div>
    </div>
    <div class="coupon-sep">
      <div class="sep-circle"></div>
      <div class="sep-line"></div>
      <div class="sep-circle"></div>
    </div>
    <div class="coupon-bottom">
      <div>
        <div class="code-label">Código</div>
        <div class="code-value" id="cCode">PETPLANET20</div>
        <div class="code-expiry" id="cExpiry">Válido hasta: 31 de julio 2025</div>
      </div>
      <div>
        <div class="conds-label">Condiciones</div>
        <div class="conds-text" id="cConds">No acumulable. Un uso por cliente.</div>
      </div>
      <div class="paw-bg">🐾</div>
    </div>
  </div>
</div>

  window.onload = function() {
    document.getElementById('couponLogo').src = LOGO;
  };

  function setType(t, btn) {
    discType = t;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('amtField').style.display = t === '2x1' ? 'none' : '';
    generate();
  }

  function generate() {
    const brand = document.getElementById('brandName').value || 'Mi Tienda';
    const val   = document.getElementById('discVal').value || '20';
    const desc  = document.getElementById('descTxt').value || '';
    const code  = document.getElementById('codeVal').value || 'CODIGO';
    const exp   = document.getElementById('expiry').value || '';
    const conds = document.getElementById('condsTxt').value || '';

    let headline;
    if (discType === 'pct')       headline = `${val}% OFF`;
    else if (discType === 'fix')  headline = `$${val} OFF`;
    else                           headline = `2×1 GRATIS`;

    document.getElementById('cBrand').textContent    = brand.toUpperCase() + ' · TIENDA DE MASCOTAS';
    document.getElementById('cHeadline').textContent = headline;
    document.getElementById('cSub').textContent      = desc;
    document.getElementById('cCode').textContent     = code.toUpperCase();
    document.getElementById('cExpiry').textContent   = exp ? `Válido hasta: ${exp}` : '';
    document.getElementById('cConds').textContent    = conds;
  }

  document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('input', generate);
  });
</script>
</body>
